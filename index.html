<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Gry Perchance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #cbd5e1;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #000 url('https://media.giphy.com/media/t745cR6OchdHG/giphy.gif') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Dark overlay for readability */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            z-index: -1;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .stats-bar {
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-tools {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            gap: 10px;
        }

        .tool-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--accent-color);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .tool-btn:hover {
            background: var(--accent-color);
        }

        .admin-panel {
            max-width: 800px;
            margin: 0 auto 30px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: none;
            border: 2px solid var(--accent-color);
            backdrop-filter: blur(10px);
        }

        .admin-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        button.btn-primary {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .header-tools {
                position: relative;
                justify-content: center;
                margin-bottom: 15px;
            }
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .game-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
            flex: 1;
            white-space: pre-line;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .play-link {
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        .clicks-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .admin-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .admin-controls button {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-edit { background: var(--warning); }
        .btn-delete { background: var(--danger); }

        /* Panel Czatu */
        .chat-sidebar {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            height: 550px;
            position: sticky;
            top: 20px;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            color: var(--accent-color);
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            background: rgba(15, 23, 42, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .chat-msg-author {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 2px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-input-area input {
            font-size: 0.85rem;
            padding: 8px;
        }

        /* Modal edycji */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px; border-radius: 12px;
            width: 90%; max-width: 500px;
            border: 1px solid var(--accent-color);
            backdrop-filter: blur(15px);
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel { background: #475569; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; }

        /* Komentarze */
        .comments-section {
            margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .comment-item { background: rgba(15, 23, 42, 0.8); padding: 8px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 8px; }
        .comment-author { font-weight: bold; color: var(--accent-color); }
        .add-comment { display: flex; gap: 5px; margin-top: 10px; }
        .add-comment input { padding: 6px; font-size: 0.85rem; }
        .add-comment button { background: var(--accent-color); border: none; color: white; padding: 0 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Odtwarzacz audio w tle -->
    <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=rain-and-thunder-113217.mp3"></audio>

    <header>
        <div class="header-tools">
            <button class="tool-btn" onclick="toggleMusic()">🎵 Muzyka: WYŁ</button>
            <button class="tool-btn" onclick="toggleAdmin()">⚙ Admin</button>
        </div>
        <h1>🎮 Moje Gry Perchance</h1>
        <p>Graj, testuj i zostaw opinię w klimatycznej atmosferze!</p>
        <div class="stats-bar">
            <span>👁 Odwiedzin strony: <strong id="site-views">...</strong></span>
        </div>
    </header>

    <!-- Panel dodawania gier (Admin) -->
    <div id="admin-panel" class="admin-panel">
        <h3>Dodaj Nową Grę</h3>
        <form id="add-game-form" onsubmit="addGame(event)">
            <div class="form-group">
                <label>Tytuł gry</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>Opis</label>
                <textarea id="desc" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Link do gry Perchance</label>
                <input type="url" id="url" required>
            </div>
            <div class="form-group">
                <label>URL Okładki/Grafiki (opcjonalnie)</label>
                <input type="url" id="image" placeholder="https://via.placeholder.com/300x180">
            </div>
            <button type="submit" class="btn-primary">Opublikuj Grę</button>
        </form>
    </div>

    <!-- Główny układ -->
    <div class="main-container">
        <div class="games-grid" id="games-container"></div>

        <!-- Panel Czatu -->
        <div class="chat-sidebar">
            <div class="chat-header">💬 Czat Społeczności</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-author" placeholder="Twój nick...">
                <input type="text" id="chat-text" placeholder="Napisz wiadomość..." onkeypress="handleChatKey(event)">
                <button class="btn-primary" onclick="sendChatMessage()" style="padding: 8px;">Wyślij</button>
            </div>
        </div>
    </div>

    <!-- Modal edycji gry -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>Edytuj Grę</h3>
            <form onsubmit="saveEditGame(event)">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Tytuł gry</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-group">
                    <label>Opis</label>
                    <textarea id="edit-desc" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Link do gry Perchance</label>
                    <input type="url" id="edit-url" required>
                </div>
                <div class="form-group">
                    <label>URL Okładki/Grafiki</label>
                    <input type="url" id="edit-image">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Zapisz Zmiany</button>
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Anuluj</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "bebospl1984";
        let isAdmin = false;
        let musicPlaying = false;

        let games = JSON.parse(localStorage.getItem('perchance_games')) || [
            {
                id: 1,
                title: "Przykładowa Gra 1",
                desc: "Opis przykładowej gry stworzonej na platformie Perchance.",
                url: "https://perchance.org",
                image: "https://picsum.photos/300/180?random=1",
                clicks: 0,
                comments: [{ author: "Gracz", text: "Fajna gierka!" }]
            }
        ];

        let chatMessages = JSON.parse(localStorage.getItem('perchance_chat')) || [
            { author: "System", text: "Witaj na czacie! Miłej gry!" }
        ];

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.querySelectorAll('.tool-btn')[0];

            if (musicPlaying) {
                music.pause();
                btn.innerText = "🎵 Muzyka: WYŁ";
            } else {
                music.play();
                btn.innerText = "🎵 Muzyka: WŁ";
            }
            musicPlaying = !musicPlaying;
        }

        function updatePageViews() {
            let views = parseInt(localStorage.getItem('site_views') || "0") + 1;
            localStorage.setItem('site_views', views);
            document.getElementById('site-views').innerText = views;
        }

        function toggleAdmin() {
            if (!isAdmin) {
                let pass = prompt("Podaj hasło administratora:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('admin-panel').classList.add('active');
                    alert("Zalogowano jako Admin!");
                    renderGames();
                } else if (pass !== null) {
                    alert("Błędne hasło!");
                }
            } else {
                isAdmin = false;
                document.getElementById('admin-panel').classList.remove('active');
                renderGames();
            }
        }

        function addGame(e) {
            e.preventDefault();
            const newGame = {
                id: Date.now(),
                title: document.getElementById('title').value,
                desc: document.getElementById('desc').value,
                url: document.getElementById('url').value,
                image: document.getElementById('image').value || 'https://via.placeholder.com/300x180?text=Brak+Grafiki',
                clicks: 0,
                comments: []
            };
            games.push(newGame);
            saveAndRender();
            document.getElementById('add-game-form').reset();
        }

        function openEditModal(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;
            document.getElementById('edit-id').value = game.id;
            document.getElementById('edit-title').value = game.title;
            document.getElementById('edit-desc').value = game.desc;
            document.getElementById('edit-url').value = game.url;
            document.getElementById('edit-image').value = game.image;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
        }

        function saveEditGame(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('edit-id').value);
            const game = games.find(g => g.id === id);
            if (game) {
                game.title = document.getElementById('edit-title').value;
                game.desc = document.getElementById('edit-desc').value;
                game.url = document.getElementById('edit-url').value;
                game.image = document.getElementById('edit-image').value || 'https://via.placeholder.com/300x180?text=Brak+Grafiki';
                saveAndRender();
                closeEditModal();
            }
        }

        function trackClick(id) {
            let game = games.find(g => g.id === id);
            if (game) {
                game.clicks = (game.clicks || 0) + 1;
                saveAndRender();
            }
        }

        function deleteGame(id) {
            if (confirm("Czy na pewno chcesz usunąć tę grę?")) {
                games = games.filter(g => g.id !== id);
                saveAndRender();
            }
        }

        function addComment(gameId) {
            const authorInput = document.getElementById(`author-${gameId}`);
            const textInput = document.getElementById(`text-${gameId}`);
            if (!authorInput.value.trim() || !textInput.value.trim()) return;

            let game = games.find(g => g.id === gameId);
            if (game) {
                if (!game.comments) game.comments = [];
                game.comments.push({ author: authorInput.value.trim(), text: textInput.value.trim() });
                saveAndRender();
            }
        }

        function sendChatMessage() {
            const authorInput = document.getElementById('chat-author');
            const textInput = document.getElementById('chat-text');

            if (!authorInput.value.trim() || !textInput.value.trim()) return;

            chatMessages.push({
                author: authorInput.value.trim(),
                text: textInput.value.trim()
            });

            localStorage.setItem('perchance_chat', JSON.stringify(chatMessages));
            textInput.value = '';
            renderChat();
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function renderChat() {
            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML = chatMessages.map(msg => `
                <div class="chat-msg">
                    <div class="chat-msg-author">${escapeHtml(msg.author)}</div>
                    <div>${escapeHtml(msg.text)}</div>
                </div>
            `).join('');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function saveAndRender() {
            localStorage.setItem('perchance_games', JSON.stringify(games));
            renderGames();
        }

        function renderGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                
                let commentsHtml = (game.comments || []).map(c => `
                    <div class="comment-item">
                        <span class="comment-author">${escapeHtml(c.author)}:</span> ${escapeHtml(c.text)}
                    </div>
                `).join('');

                card.innerHTML = `
                    <img src="${game.image}" alt="${escapeHtml(game.title)}">
                    <div class="game-info">
                        <h2 class="game-title">${escapeHtml(game.title)}</h2>
                        <p class="game-desc">${escapeHtml(game.desc)}</p>
                        
                        <div class="card-footer">
                            <a href="${game.url}" target="_blank" class="play-link" onclick="trackClick(${game.id})">🎮 Graj</a>
                            <span class="clicks-count">🔥 Zagrało: ${game.clicks || 0}</span>
                        </div>

                        ${isAdmin ? `
                            <div class="admin-controls">
                                <button class="btn-edit" onclick="openEditModal(${game.id})">✏️ Edytuj</button>
                                <button class="btn-delete" onclick="deleteGame(${game.id})">🗑️ Usuń</button>
                            </div>
                        ` : ''}

                        <div class="comments-section">
                            <strong>Komentarze:</strong>
                            ${commentsHtml || '<p style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">Brak komentarzy. Bądź pierwszy!</p>'}
                            
                            <div class="add-comment">
                                <input type="text" id="author-${game.id}" placeholder="Nick" style="width:30%;">
                                <input type="text" id="text-${game.id}" placeholder="Komentarz..." style="width:50%;">
                                <button onclick="addComment(${game.id})">OK</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Start
        updatePageViews();
        renderGames();
        renderChat();
    </script>
</body>
</html>
