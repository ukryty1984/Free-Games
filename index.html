<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Gry Perchance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .stats-bar {
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .admin-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .admin-panel {
            max-width: 800px;
            margin: 0 auto 30px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: none;
            border: 2px solid var(--accent-color);
        }

        .admin-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        button.btn-primary {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }

        .games-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
        }

        .game-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .game-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
            flex: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .play-link {
            background: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
        }

        .clicks-count {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Comments section */
        .comments-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        .comment-item {
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .comment-author {
            font-weight: bold;
            color: var(--accent-color);
        }

        .add-comment {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .add-comment input {
            padding: 6px;
            font-size: 0.85rem;
        }

        .add-comment button {
            background: var(--accent-color);
            border: none;
            color: white;
            padding: 0 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <button class="admin-btn" onclick="toggleAdmin()">⚙ Admin</button>
        <h1>🎮 Moje Gry Perchance</h1>
        <p>Graj, testuj i zostaw opinię!</p>
        <div class="stats-bar">
            <span>👁 Odwiedzin strony: <strong id="site-views">...</strong></span>
        </div>
    </header>

    <!-- Panel dodawania gier (tylko dla Admina) -->
    <div id="admin-panel" class="admin-panel">
        <h3>Dodaj Nową Grę</h3>
        <form id="add-game-form" onsubmit="addGame(event)">
            <div class="form-group">
                <label>Tytuł gry</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label>Opis</label>
                <textarea id="desc" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Link do gry Perchance</label>
                <input type="url" id="url" required>
            </div>
            <div class="form-group">
                <label>URL Okładki/Grafiki (opcjonalnie)</label>
                <input type="url" id="image" placeholder="https://via.placeholder.com/300x180">
            </div>
            <button type="submit" class="btn-primary">Opublikuj Grę</button>
        </form>
    </div>

    <!-- Lista gier -->
    <div class="games-grid" id="games-container"></div>

    <script>
        // Domyślne hasło admina (możesz zmienić poniżej)
        const ADMIN_PASSWORD = "bebospl1984";
        let isAdmin = false;

        // Domyślna lista gier
        let games = JSON.parse(localStorage.getItem('perchance_games')) || [
            {
                id: 1,
                title: "Przykładowa Gra 1",
                desc: "Opis przykładowej gry stworzonej na platformie Perchance.",
                url: "https://perchance.org",
                image: "https://picsum.photos/300/180?random=1",
                clicks: 0,
                comments: [
                    { author: "Gracz", text: "Fajna gierka!" }
                ]
            }
        ];

        // Zliczanie odwiedzin strony
        function updatePageViews() {
            let views = parseInt(localStorage.getItem('site_views') || "0") + 1;
            localStorage.setItem('site_views', views);
            document.getElementById('site-views').innerText = views;
        }

        function toggleAdmin() {
            if (!isAdmin) {
                let pass = prompt("Podaj hasło administratora:");
                if (pass === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('admin-panel').classList.add('active');
                    alert("Zalogowano jako Admin!");
                    renderGames();
                } else if (pass !== null) {
                    alert("Błędne hasło!");
                }
            } else {
                isAdmin = false;
                document.getElementById('admin-panel').classList.remove('active');
                renderGames();
            }
        }

        function addGame(e) {
            e.preventDefault();
            const newGame = {
                id: Date.now(),
                title: document.getElementById('title').value,
                desc: document.getElementById('desc').value,
                url: document.getElementById('url').value,
                image: document.getElementById('image').value || 'https://via.placeholder.com/300x180?text=Brak+Grafiki',
                clicks: 0,
                comments: []
            };

            games.push(newGame);
            saveAndRender();
            document.getElementById('add-game-form').reset();
        }

        function trackClick(id) {
            let game = games.find(g => g.id === id);
            if (game) {
                game.clicks = (game.clicks || 0) + 1;
                saveAndRender();
            }
        }

        function deleteGame(id) {
            if (confirm("Czy na pewno chcesz usunąć tę grę?")) {
                games = games.filter(g => g.id !== id);
                saveAndRender();
            }
        }

        function addComment(gameId) {
            const authorInput = document.getElementById(`author-${gameId}`);
            const textInput = document.getElementById(`text-${gameId}`);

            if (!authorInput.value.trim() || !textInput.value.trim()) return;

            let game = games.find(g => g.id === gameId);
            if (game) {
                if (!game.comments) game.comments = [];
                game.comments.push({
                    author: authorInput.value.trim(),
                    text: textInput.value.trim()
                });
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('perchance_games', JSON.stringify(games));
            renderGames();
        }

        function renderGames() {
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                
                let commentsHtml = (game.comments || []).map(c => `
                    <div class="comment-item">
                        <span class="comment-author">${escapeHtml(c.author)}:</span> ${escapeHtml(c.text)}
                    </div>
                `).join('');

                card.innerHTML = `
                    <img src="${game.image}" alt="${escapeHtml(game.title)}">
                    <div class="game-info">
                        <h2 class="game-title">${escapeHtml(game.title)}</h2>
                        <p class="game-desc">${escapeHtml(game.desc)}</p>
                        
                        <div class="card-footer">
                            <a href="${game.url}" target="_blank" class="play-link" onclick="trackClick(${game.id})">🎮 Graj</a>
                            <span class="clicks-count">🔥 Zagrało: ${game.clicks || 0}</span>
                        </div>

                        ${isAdmin ? `<button onclick="deleteGame(${game.id})" style="background:var(--danger); color:white; border:none; padding:5px; margin-top:10px; border-radius:4px; cursor:pointer;">Usuń grę</button>` : ''}

                        <div class="comments-section">
                            <strong>Komentarze:</strong>
                            ${commentsHtml || '<p style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">Brak komentarzy. Bądź pierwszy!</p>'}
                            
                            <div class="add-comment">
                                <input type="text" id="author-${game.id}" placeholder="Twój nick" style="width:30%;">
                                <input type="text" id="text-${game.id}" placeholder="Napisz komentarz..." style="width:50%;">
                                <button onclick="addComment(${game.id})">Wyślij</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Start
        updatePageViews();
        renderGames();
    </script>
</body>
</html>
