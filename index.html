<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Gamingowy Hub Perchance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c31',
                        accentNeon: '#10b981',
                        accentHover: '#059669',
                        perchancePurple: '#8b5cf6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-darkBg/80 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-gamepad text-xl text-slate-950"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">Perchance Hub</h1>
                    <p class="text-xs text-slate-400">Twoja kolekcja gier w jednym miejscu</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button onclick="openModal()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20 transition-all transform active:scale-95 flex items-center space-x-2 text-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>Dodaj grę</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Search and Filter Bar -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-stretch md:items-center">
            <!-- Search input -->
            <div class="relative flex-grow max-w-md">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterGames()" placeholder="Szukaj gry po tytule lub opisie..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-900/80 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm">
            </div>

            <!-- Categories Filter -->
            <div id="categoryFilters" class="flex flex-wrap gap-2 items-center">
                <button onclick="filterByCategory('Wszystkie')" class="category-btn px-3.5 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 text-slate-950 transition-all shadow-sm" data-category="Wszystkie">Wszystkie</button>
            </div>
        </div>

        <!-- Games Grid -->
        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically populated via JS -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-center mb-4 text-slate-500 text-3xl">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-300 mb-1">Brak gier w kolekcji</h3>
            <p class="text-sm text-slate-500 max-w-sm mb-6">Dodaj swoją pierwszą grę z Perchance, klikając przycisk powyżej!</p>
            <button onclick="openModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-4 py-2 rounded-xl text-sm transition-all border border-slate-700">
                Dodaj pierwszą grę
            </button>
        </div>
    </main>

    <!-- Modal Add/Edit Game -->
    <div id="gameModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-gamepad text-emerald-400"></i>
                    <span>Dodaj nową grę</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 transition-colors w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800/50 hover:bg-slate-800">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="gameForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="gameId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Tytuł gry *</label>
                    <input type="text" id="gameTitle" required placeholder="np. Kosmiczny Wyścig" 
                        class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Link do Perchance *</label>
                    <input type="url" id="gameLink" required placeholder="https://perchance.org/twoja-gra" 
                        class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Kategoria</label>
                        <input type="text" id="gameCategory" placeholder="np. RPG, Przygodowa" 
                            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Ikona / Emoji</label>
                        <input type="text" id="gameEmoji" placeholder="🎲 lub 🚀" maxlength="4" value="🎮"
                            class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm text-center">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Krótki opis</label>
                    <textarea id="gameDescription" rows="3" placeholder="Napisz krótko, o czym jest ta gra..." 
                        class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm resize-none"></textarea>
                </div>

                <div class="pt-2 flex items-center justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl text-sm transition-all">
                        Anuluj
                    </button>
                    <button type="submit" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-xl text-sm transition-all shadow-lg shadow-emerald-500/20">
                        Zapisz grę
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-800 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
        <div id="toastIcon" class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-check"></i>
        </div>
        <span id="toastMessage" class="text-sm font-medium">Operacja zakończona sukcesem</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial mock data if localStorage is empty
        const defaultGames = [
            {
                id: '1',
                title: 'Cyberpunkowy Generator Postaci',
                link: 'https://perchance.org',
                category: 'RPG',
                emoji: '🤖',
                description: 'Stwórz unikalnego bohatera w mrocznym świecie przyszłości z unikalnymi wszczepami.'
            },
            {
                id: '2',
                title: 'Wielki Quiz Wiedzy Fantastycznej',
                link: 'https://perchance.org',
                category: 'Quiz',
                emoji: '🔮',
                description: 'Sprawdź swoją wiedzę o smokach, magii i starożytnych artefaktach.'
            },
            {
                id: '3',
                title: 'Symulator Przetrwania w Kosmosie',
                link: 'https://perchance.org',
                category: 'Przetrwanie',
                emoji: '🚀',
                description: 'Zarządzaj zasobami statku kosmicznego po awarii napędu poddźwiękowego.'
            }
        ];

        let games = [];
        let currentCategory = 'Wszystkie';

        // Load data on startup
        function initApp() {
            const stored = localStorage.getItem('perchance_hub_games');
            if (stored) {
                try {
                    games = JSON.parse(stored);
                } catch(e) {
                    games = defaultGames;
                }
            } else {
                games = defaultGames;
                saveGames();
            }
            renderCategories();
            renderGames();
        }

        function saveGames() {
            localStorage.setItem('perchance_hub_games', JSON.stringify(games));
        }

        // Render category filters
        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            const categories = ['Wszystkie', ...new Set(games.map(g => g.category || 'Inne').filter(Boolean))];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterByCategory('${cat}')" 
                    class="category-btn px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all shadow-sm ${currentCategory === cat ? 'bg-emerald-500 text-slate-950 font-semibold' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800'}" 
                    data-category="${cat}">
                    ${cat}
                </button>
            `).join('');
        }

        // Filter games by category
        function filterByCategory(category) {
            currentCategory = category;
            renderCategories();
            renderGames();
        }

        // Filter and search games grid
        function renderGames() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('gamesGrid');
            const emptyState = document.getElementById('emptyState');

            const filtered = games.filter(game => {
                const matchesCategory = currentCategory === 'Wszystkie' || (game.category || 'Inne') === currentCategory;
                const matchesSearch = game.title.toLowerCase().includes(searchTerm) || (game.description && game.description.toLowerCase().includes(searchTerm));
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.remove('flex');
            emptyState.classList.add('hidden');

            grid.innerHTML = filtered.map(game => `
                <div class="group bg-slate-900/90 border border-slate-800/80 hover:border-emerald-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 hover:shadow-xl hover:shadow-emerald-500/5 relative overflow-hidden">
                    <!-- Top accent glow on hover -->
                    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 to-cyan-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    
                    <div>
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center text-2xl shadow-inner group-hover:scale-105 transition-transform">
                                    ${game.emoji || '🎮'}
                                </div>
                                <div>
                                    <span class="inline-block px-2.5 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-1">
                                        ${game.category || 'Inne'}
                                    </span>
                                    <h3 class="font-bold text-slate-100 text-base leading-tight group-hover:text-emerald-400 transition-colors line-clamp-1">${escapeHtml(game.title)}</h3>
                                </div>
                            </div>
                            
                            <!-- Action dropdown / buttons -->
                            <div class="flex items-center space-x-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                <button onclick="openEditModal('${game.id}')" title="Edytuj" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800 flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteGame('${game.id}')" title="Usuń" class="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <p class="text-slate-400 text-xs line-clamp-2 mb-4 leading-relaxed">${escapeHtml(game.description || 'Brak opisu dla tej gry.')}</p>
                    </div>

                    <div class="pt-3 border-t border-slate-800/60 flex items-center justify-between">
                        <span class="text-[11px] text-slate-500 truncate max-w-[150px]"><i class="fa-solid fa-link mr-1"></i>${escapeHtml(game.link)}</span>
                        <a href="${escapeHtml(game.link)}" target="_blank" rel="noopener noreferrer" 
                            class="bg-emerald-500/10 hover:bg-emerald-500 text-emerald-400 hover:text-slate-950 border border-emerald-500/20 font-semibold px-4 py-2 rounded-xl text-xs transition-all flex items-center space-x-1.5 shadow-sm">
                            <span>Zagraj</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterGames() {
            renderGames();
        }

        // Modal Controls
        function openModal() {
            document.getElementById('gameId').value = '';
            document.getElementById('gameForm').reset();
            document.getElementById('gameEmoji').value = '🎮';
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-gamepad text-emerald-400 mr-2"></i>Dodaj nową grę';
            
            const modal = document.getElementById('gameModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function openEditModal(id) {
            const game = games.find(g => g.id === id);
            if (!game) return;

            document.getElementById('gameId').value = game.id;
            document.getElementById('gameTitle').value = game.title;
            document.getElementById('gameLink').value = game.link;
            document.getElementById('gameCategory').value = game.category || '';
            document.getElementById('gameEmoji').value = game.emoji || '🎮';
            document.getElementById('gameDescription').value = game.description || '';
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-emerald-400 mr-2"></i>Edytuj grę';

            const modal = document.getElementById('gameModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('gameModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Form Submit Handler (Add or Edit)
        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('gameId').value;
            const title = document.getElementById('gameTitle').value.trim();
            const link = document.getElementById('gameLink').value.trim();
            const category = document.getElementById('gameCategory').value.trim() || 'Inne';
            const emoji = document.getElementById('gameEmoji').value.trim() || '🎮';
            const description = document.getElementById('gameDescription').value.trim();

            if (id) {
                // Edit existing
                games = games.map(g => g.id === id ? { id, title, link, category, emoji, description } : g);
                showToast('Gra została pomyślnie zaktualizowana!');
            } else {
                // Add new
                const newGame = {
                    id: Date.now().toString(),
                    title,
                    link,
                    category,
                    emoji,
                    description
                };
                games.unshift(newGame);
                showToast('Nowa gra została dodana!');
            }

            saveGames();
            renderCategories();
            renderGames();
            closeModal();
        }

        // Delete game
        function deleteGame(id) {
            if (confirm('Czy na pewno chcesz usunąć tę grę z listy?')) {
                games = games.filter(g => g.id !== id);
                saveGames();
                renderCategories();
                renderGames();
                showToast('Gra została usunięta.');
            }
        }

        // Toast Helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            msgEl.textContent = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Security escape helper
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace('&', '&amp;')
                      .replace('<', '&lt;')
                      .replace('>', '&gt;')
                      .replace('"', '&quot;')
                      .replace("'", '&#039;');
        }

        // Initialize on load
        window.onload = initApp;
    </script>
</body>
</html>
